---
- name: Install Cron and Setup Backup
  hosts: webserver
  vars_files:
    - vars.yml
  become: yes
  
  tasks:
    - name: Install cronie package
      dnf:
        name: cronie
        state: present

    - name: Ensure crond service is running
      systemd:
        name: crond
        state: started
        enabled: yes

    - name: Create backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Create backup script
      template:
        src: templates/backup_script.sh.j2
        dest: /usr/local/bin/backup_notes.sh
        mode: '0755'

    - name: Schedule backup cron job
      cron:
        name: "Daily {{ app_name }} backup"
        minute: "0"
        hour: "2"
        job: "/usr/local/bin/backup_notes.sh >> /var/log/backup.log 2>&1"
        state: present

    - name: Test cron job
      command: crontab -l
      register: cron_list
      changed_when: false

    - name: Show cron jobs
      debug:
        msg: "{{ cron_list.stdout_lines }}"
